<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akbank Hesap Bilgileri</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fff5f5, #f8fafc);
  font-family: Arial, sans-serif;
  color: #111827;
  padding: 20px 0;
}

.card {
  width: calc(100% - 32px);
  max-width: 430px;
  background: white;
  padding: 28px 22px;
  border-radius: 22px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.10);
  text-align: center;
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
  color: #111827;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

/* Akbank kutuları */
.bank-card {
  padding: 20px 14px;
  border-radius: 16px;
  margin-bottom: 18px;
  background: #fff5f5;
  border: 1px solid #f3c4c8;
}

/* Son kutunun alt boşluğu */
.bank-card:last-child {
  margin-bottom: 0;
}

/* Akbank Logo */
.akbank-logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 14px;
  background: #ffffff;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e30613;
  font-size: 16px;
  font-weight: bold;
  border: 2px solid #e30613;
}

.bank-name {
  color: #e30613;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 7px;
}

.person-name {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 13px;
}

.iban {
  background: white;
  padding: 15px 10px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.5px;
  word-break: break-all;
  margin-bottom: 12px;
  border: 1px solid #e5e7eb;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #e30613;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:active {
  transform: scale(0.98);
}

button:hover {
  background: #c9000b;
}

.message {
  margin-top: 10px;
  color: #16a34a;
  font-weight: bold;
  font-size: 14px;
  min-height: 18px;
}

</style>
</head>

<body>

<div class="card">

  <h1>Banka Hesap Bilgileri</h1>

  <div class="subtitle">
    IBAN bilgilerini aşağıdan kopyalayabilirsiniz.
  </div>


  <!-- AKBANK - İRFAN ÇAKIRBEY -->

  <div class="bank-card">

    <div class="akbank-logo">
      AKBANK
    </div>

    <div class="bank-name">
      Akbank
    </div>

    <div class="person-name">
      İrfan Çakırbey
    </div>

    <div class="iban">
      TR220004600334888000262404
    </div>

    <button onclick="copyIBAN('TR220004600334888000262404', 'message1')">
      IBAN'ı Kopyala
    </button>

    <div class="message" id="message1"></div>

  </div>


  <!-- AKBANK - TANEM BİLGİ -->

  <div class="bank-card">

    <div class="akbank-logo">
      AKBANK
    </div>

    <div class="bank-name">
      Akbank
    </div>

    <div class="person-name">
      Tanem Bilgi
    </div>

    <div class="iban">
      TR740004600334888000159424
    </div>

    <button onclick="copyIBAN('TR740004600334888000159424', 'message2')">
      IBAN'ı Kopyala
    </button>

    <div class="message" id="message2"></div>

  </div>

</div>


<script>

function copyIBAN(iban, messageId) {

  navigator.clipboard.writeText(iban)
    .then(function() {

      document.getElementById(messageId).textContent =
        "IBAN panoya kopyalandı ✓";

    })
    .catch(function() {

      const textArea = document.createElement("textarea");

      textArea.value = iban;

      document.body.appendChild(textArea);

      textArea.select();

      document.execCommand("copy");

      textArea.remove();

      document.getElementById(messageId).textContent =
        "IBAN panoya kopyalandı ✓";

    });

}

</script>

</body>
</html>
